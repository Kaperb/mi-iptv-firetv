name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MiIPTV.apk

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MiIPTV-apk
          path: MiIPTV.apk

      - name: Publicar APK en Releases (enlace de descarga directo)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Mi IPTV (última versión)
          files: MiIPTV.apk
